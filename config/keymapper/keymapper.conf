@forward-modifiers ControlLeft
@virtual-keys-toggle false

### Modifier remapping

# Use Alt to emulate macOS Cmd
Cmd = Alt
MetaHold = Virtual # State to hold Meta down (used for specific shortcuts)
Cmd >> Meta{Meta} ^ !MetaHold # Hold Meta down with hold state release

# Use Meta to emulate macOS Opt
Opt = Meta
AltPressGuard = ControlRight # Prevents Alt press behavior (triggers menu bar)
Opt >> Alt{AltPressGuard Alt} ^ # Hold Alt down with press guard

# Map Shift to a surrogate key to prevent release in shortcuts
ShiftHold = F24
Shift >> ShiftHold

# Map both Control keys to left Control, reserving right Control for Cmd
ControlRight >> ControlLeft

### Shortcuts for all applications

# Window positioning
(Control Opt){ArrowUp} >> !Alt Shift{F13}
(Control Opt){ArrowDown} >> !Alt Shift{F14}
(Control Opt){ArrowLeft} >> !Alt Shift{F15}
(Control Opt){ArrowRight} >> !Alt Shift{F16}
(Control Opt){Enter} >> !Alt Shift{F17}

# Media playback
(Control Opt){BracketLeft} >> !Alt MediaTrackPrevious
(Control Opt){BracketRight} >> !Alt MediaTrackNext
(Control Opt){Backslash} >> !Alt MediaPlayPause

# Precise audio control
Opt{AudioVolumeDown} >> $(pactl set-sink-volume @DEFAULT_SINK@ -1dB)
Opt{AudioVolumeUp} >> $(pactl set-sink-volume @DEFAULT_SINK@ +1dB)

### Shortcuts for general applications + VS Code
[class != "com.mitchellh.ghostty"]

Cmd{ArrowLeft} >> !Meta Home # Move cursor to start of line
Cmd{ArrowRight} >> !Meta End # Move cursor to end of line
Cmd{ArrowUp} >> !Meta Control{Home} # Move cursor to start of input
Cmd{ArrowDown} >> !Meta Control{End} # Move cursor to end of input

Opt{ArrowLeft} >> !Alt Control{ArrowLeft} # Move cursor left by word
Opt{ArrowRight} >> !Alt Control{ArrowRight} # Move cursor right by word

Opt{Backspace} >> !Alt Control{Backspace} # Delete word backward
Opt{Delete} >> !Alt Control{Delete} # Delete word forward
(Opt Shift){Backspace} >> !Alt (Alt Shift){Backspace} # Keep unmodified
(Opt Shift){Delete} >> !Alt (Alt Shift){Delete} # Keep unmodified

(Opt Cmd){ArrowUp} >> !Alt !Meta (Alt Control){ArrowUp} # Add cursor above
(Opt Cmd){ArrowDown} >> !Alt !Meta (Alt Control){ArrowDown} # Add cursor below

### Shortcuts for general applications
[class != /^com.microsoft.VSCode|com.mitchellh.ghostty$/]

Cmd{Backspace} >> !Meta Shift{Home} Delete # Delete line backward
Cmd{Delete} >> !Meta Shift{End} Delete # Delete line forward

### Shortcuts for VS Code
[class = "com.microsoft.VSCode"]

# Move editor shortcut
(Control Cmd){ArrowLeft} >> !Meta (Control Alt){ArrowLeft}
(Control Cmd){ArrowRight} >> !Meta (Control Alt){ArrowRight}

# Workaround for line deletion shortcuts
#
# In VS Code, cursor movement within editor inputs can be fully remapped from
# any keystroke, but other inputs (quick picks, search widgets, file pickers)
# cannot be remapped. To implement line deletion, multiple keystrokes are
# required, which works fine for inputs (editor or otherwise) but doesn't map
# cleanly to terminal keybindings.
#
# Because of this, we make the choice to sacrifice line deletion keybindings in
# non-editor inputs so we can have line deletion be triggered by a single
# keystroke using surrogate keys, which can then be handled in VS Code
# keybindings for the editor and terminal.
Cmd{Backspace} >> !Meta Control{F13}
Cmd{Delete} >> !Meta Control{F14}

# Workaround for smart select shortcuts
#
# The physical keys used for these shortcuts map to the keystrokes sent for
# selecting by word.
(Control Shift){ArrowLeft} >> !ShiftHold Control{F15}
(Control Shift){ArrowRight} >> !ShiftHold Control{F16}

# Workaround for triggering command palette in terminal
#
# This conflicts with my shortcut for printing the active file path to the
# terminal.
(Cmd Shift){P} >> !Meta !ShiftHold Control{F17}

### Shortcuts for VS Code + Terminal
[class = /^com.microsoft.VSCode|com.mitchellh.ghostty$/]

# Workaround for copy/paste/search in terminal
Control{C} >> (Control Alt){C}
Control{V} >> (Control Alt){V}
Control{F} >> (Control Alt){F}

[stage]

# Map Meta to Control for mouse and shortcuts
Meta >> ControlRight

# Except for some shortcuts
Meta{Tab} >> !ControlRight MetaHold Tab # Window switcher (keeps Meta held down)
Meta{Space} >> !ControlRight Meta{Space} # Overview search, emoji picker

[stage]

MetaHold >> Meta
ShiftHold >> Shift
